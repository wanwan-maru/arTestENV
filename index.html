<!doctype html>
    <head>
        <!-- A-Frame ライブラリの読み込み ※GIFはV0.9.0から 1.7.1  -->
        <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
        <!-- AR.js ライブラリの読み込み -->
        <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
        <!-- shader ライブラリの読み込み fork元 mayognaise/aframe-gif-shader/master/dist/aframe-gif-shader.min.js -->
        <script src="https://raw.githack.com/wanwan-maru/ags-fork/master/dist/aframe-gif-shader.min.js"></script>

        <!-- gesture ライブラリの読み込み 指で表示画像の大きさを変更できる -->
        <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-detector.js"></script>
        <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-handler.js"></script>
    </head>

    <body>
        <script>
            <!-- 画像定義 -->
            const images = [
                { key: "img1", type: "png", file: "assets/test1.bin", mode: "binary" },
                { key: "img2", type: "png", file: "assets/test2.bin", mode: "binary" }
            ];

            <!-- 読み込み関数 -->
            function loadImage(img) {
                if (img.mode === "base64") {
                    return fetch(img.file)
                        .then(res => res.text())
                        .then(data => {
                            return {
                                key: img.key,
                                src: `data:image/$(img.type);base64,${base64}`
                            };
                        });
                }

                if (img.mode === "binary") {
                    return fetch(img.file)
                        .then(res => res.arrayBuffer())

                const srcMap = {};
                result.forEach(item => {
                    srcMap[item.key] = item.src:
                });
            }];   

                                                   
        <!-- AR表示の作成 -->
        <a-scene embedded
            vr-mode-ui="enabled: false;"
            loading-screen="enabled: false;"
            arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;"
            renderer="preserveDrawingBuffer: true"
            gesture-detector  
        >
            
            <!-- ここにAR Marker1の設定を入れる。urlでフォルダ内の.pattファイルを指定している -->
            <a-marker
                type="pattern" preset="custom" url="assets/pattern-kantoku.patt"
                raycaster="objects: .clickable"
                emitevents="true"
                cursor="fuse: false; rayOrigin: mouse;"
            >
                    <!-- ここに表示するgif情報を入れている -->
                    <a-entity
                        geometry="primitive:plane;" material="shader:gif; src:url(assets/asset2.gif);"
                        rotation="-90 0 0" scale="4 4 4"
                        gesture-handler class="clickable"
                    ></a-entity>
            </a-marker>

            <!-- ここにAR Marker2の設定を入れる。urlでフォルダ内の.pattファイルを指定している -->
            <a-marker
                type="pattern" preset="custom" url="assets/markerAR.patt"
                raycaster="objects: .clickable"
                emitevents="true"
                cursor="fuse: false; rayOrigin: mouse;"
            >
                <!-- ここに表示する画像情報を入れている。pngで透過可能。gifも使えるけど静止画になる -->
                <!-- 画像を水平に表示させる場合：rotation の最初の角度を「-90」, 他はhttps://aframe.io/docs/1.6.0/introduction/参照 -->
                <!-- 画像の位置：マーカー基準でposition x(正が右、負が左?)  y(正が右、負が左?) z(正が下、負が上?)  -->
                <a-image
                    src = srcMap.img1;
                    <!-- src="assets/HCG-kh.png" -->
                    rotation="-90 0 0" scale="3 3 3" position="0 0 0"
                    gesture-handler class="clickable"
                ></a-image>
            </a-marker>
                
            <!-- ここにAR Marker3の設定を入れる。urlでフォルダ内の.pattファイルを指定している -->
            <a-marker
                type="pattern" preset="custom" url="assets/marker.patt"
                raycaster="objects: .clickable"
                emitevents="true"
                cursor="fuse: false; rayOrigin: mouse;"
            >
                <!-- 複数表示する場合は入れ子にしたほうが楽、奥に表示するものから記述する -->
                <a-image
                    src ="srcMap.img1" 
                    <!-- src="assets/HCG-kh.png" -->
                    rotation="-90 0 0" scale="2 2 2" position="0 0 0">
                    <a-image
                        src="srcMap.img2"
                        <!-- // src="assets/HCG-mm.png" -->
                        scale="1 1 1" position="0 0 -.1">
                    </a-image>
                </a-image>
            </a-marker>
                
            <a-entity camera></a-entity>
        </a-scene>

        </script>
        
    </body>
</html>
