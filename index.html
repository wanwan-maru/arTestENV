<!doctype html>
    <head>
        <!-- A-Frame ライブラリの読み込み ※GIFはV0.9.0から 1.7.1  -->
        <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
        <!-- AR.js ライブラリの読み込み -->
        <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
        <!-- shader ライブラリの読み込み fork元 mayognaise/aframe-gif-shader/master/dist/aframe-gif-shader.min.js -->
        <script src="https://raw.githack.com/wanwan-maru/ags-fork/master/dist/aframe-gif-shader.min.js"></script>

        <!-- gesture ライブラリの読み込み 指で表示画像の大きさを変更できる -->
        <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-detector.js"></script>
        <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-handler.js"></script>
    </head>

    <body style="margin: 0; overflow: hidden;">
        <!-- AR表示の作成 -->
        <a-scene embedded
            vr-mode-ui="enabled: false;"
            loading-screen="enabled: false;"
            arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;"
            renderer="preserveDrawingBuffer: true"
            gesture-detector  
        >
            
            <!-- ここにAR Marker1の設定を入れる。urlでフォルダ内の.pattファイルを指定している -->
            <a-marker
                url="assets/pattern-kantoku.patt"
                type="pattern" preset="custom"
                raycaster="objects: .clickable"
                emitevents="true"
                cursor="fuse: false; rayOrigin: mouse;"
            >
                    <!-- ここに表示するgif情報を入れている -->
                    <!-- GIF直接の場合     material="shader:gif; src:url(assets/asset2.gif);"  -->
                    <!-- バイナリにする場合 id="gif1"  -->
                    <a-entity
                        id="gif1"
                        geometry="primitive:plane;"
                        rotation="-90 0 0" scale="4 4 4"
                        gesture-handler class="clickable"
                    ></a-entity>
            </a-marker>

            <!-- ここにAR Marker2の設定を入れる。urlでフォルダ内の.pattファイルを指定している -->
            <a-marker
                url="assets/marker.patt"
                type="pattern" preset="custom"
                raycaster="objects: .clickable"
                emitevents="true"
                cursor="fuse: false; rayOrigin: mouse;"
            >
                <!-- ここに表示する画像情報を入れている。pngで透過可能。gifも使えるけど静止画になる -->
                <!-- 画像を水平に表示させる場合：rotation の最初の角度を「-90」, 他はhttps://aframe.io/docs/1.6.0/introduction/参照 -->
                <!-- 画像の位置：マーカー基準でposition x(正が右、負が左?)  y(正が右、負が左?) z(正が下、負が上?)  -->
                <!-- src="assets/HCG-kh.png"       id="imgMarker2"     src = srcMap.img1; -->
                <a-image
                    src="assets/HCG-kh.png"
                    rotation="-90 0 0" scale="3 3 3" position="0 0 0"
                    gesture-handler class="clickable"
                ></a-image>
            </a-marker>
                
            <!-- ここにAR Marker3の設定を入れる。urlでフォルダ内の.pattファイルを指定している -->
            <a-marker
                type="pattern" preset="custom" url="assets/markerAR.patt"
                raycaster="objects: .clickable"
                emitevents="true"
                cursor="fuse: false; rayOrigin: mouse;"
            >
                <!-- 複数表示する場合は入れ子にしたほうが楽、奥に表示するものから記述する -->
                <!-- src="assets/HCG-kh.png" -->
                <!-- // src="assets/HCG-mm.png" -->
                <a-image
                    id="img1"                    
                    rotation="-90 0 0" scale="2 2 2" position="0 0 0">
                    <a-image
                        id="img2"                     
                        scale="1 1 1" position="0 0 -.1">
                    </a-image>
                </a-image>
            </a-marker>
                
            <a-entity camera></a-entity>
        </a-scene>

        
        <script>
            // 画像定義
            const images = [
                { key: "img1", type: "png", file: "assets/test1.bin", mode: "base64" },
                { key: "img2", type: "png", file: "assets/test2.bin", mode: "base64" },
                // GIFの場合
                { key: "gif1", type: "gif", file: "assets/test3.bin", mode: "base64" }
            ];

            // 読み込み関数
            function loadImage(img) {   
                return fetch(img.file)
        .then(res => res.body.getReader().read())
        .then(({ value }) => {
            const base64 = new TextDecoder("ascii").decode(value);
            return {
                key: img.key,
                src: `data:image/${img.type};base64,${base64}`
            };
        });
}

            // 一括読み込み
            Promise.all(images.map(loadImage)).then(result => {
                const srcMap = {};
                result.forEach(item => {
                srcMap[item.key] = item.src;
                });

                // A-Frame 要素に反映
                document.querySelector("#img1").setAttribute("src", srcMap.img1);
                document.querySelector("#img2").setAttribute("src", srcMap.img2);
                // GIFの場合
                document.querySelector("#gif1").setAttribute("material", {
                    shader: "gif",
                    src: srcMap.gif1
                });
            });
        </script>
        
    </body>
</html>
