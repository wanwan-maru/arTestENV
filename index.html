<!doctype html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>test</title>
        <!-- A-Frame ライブラリの読み込み ※GIFはV0.9.0から -->
        <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
        <!-- AR.js ライブラリの読み込み -->
        <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
        <!-- shader ライブラリの読み込み fork元 mayognaise/aframe-gif-shader/master/dist/aframe-gif-shader.min.js -->
        <script src="https://raw.githack.com/wanwan-maru/ags-fork/master/dist/aframe-gif-shader.min.js"></script>

        <!-- gesture ライブラリの読み込み 指で表示画像の大きさを変更できる -->
        <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-detector.js"></script>
        <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-handler.js"></script>

        <style>
            body {
                margin: 0;
                font-family: -apple-system, BlinkMacSystemFont, sans-serif;
                background: #000;
                color: #fff;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: space-between;
                height: 100vh;
                overflow: hidden;
                position: relative;
            }
            a-scene {
                width: 100%;
                height: 100vh;
            }
            .camera-controls {
                width: 100%;
                max-width: 400px;
                padding: 20px;
                display: flex;
                justify-content: center;
                align-items: center;
                background: linear-gradient(to bottom, rgba(0, 0, 0, 0.8), #000);
                position: absolute;
                bottom: 0;
                left: 0;
                right: 0;
                margin: auto;
            }
            .shutter-button {
                width: 80px;
                height: 80px;
                background: radial-gradient(circle, #fff 60%, #ccc 65%, #000 70%);
                border-radius: 50%;
                border: 3px solid #ccc;
                cursor: pointer;
                transition: transform 0.1s;
            }
            .shutter-button:active {
                transform: scale(0.95);
            }
            .shutter-button:focus {
                outline: none;
            }
        </style>
    </head>

    <body style="margin: 0; overflow: hidden;">
        <a-scene embedded
            vr-mode-ui="enabled: false;"
            loading-screen="enabled: false;"
            arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;"
            gesture-detector
            
            screenshot="width: 2048; height: 1024"
            
        >
            
            <!-- ここにAR Marker1の設定を入れる。urlでフォルダ内の.pattファイルを指定している -->
            <a-marker
                type="pattern" preset="custom" url="assets/pattern-kantoku.patt"
                raycaster="objects: .clickable"
                emitevents="true"
                cursor="fuse: false; rayOrigin: mouse;"
            >
                    <!-- ここに表示するgif情報を入れている -->
                    <a-entity
                        geometry="primitive:plane;" material="shader:gif; src:url(assets/asset2.gif);"
                        rotation="-90 0 0" scale="4 4 4"
                        gesture-handler class="clickable"
                    ></a-entity>
            </a-marker>

            <!-- ここにAR Marker2の設定を入れる。urlでフォルダ内の.pattファイルを指定している -->
            <a-marker
                type="pattern" preset="custom" url="assets/markerAR.patt"
                raycaster="objects: .clickable"
                emitevents="true"
                cursor="fuse: false; rayOrigin: mouse;"
            >
                <!-- ここに表示する画像情報を入れている。pngで透過可能。gifも使えるけど静止画になる -->
                <!-- 画像を水平に表示させる場合：rotation の最初の角度を「-90」, 他はhttps://aframe.io/docs/1.6.0/introduction/参照 -->
                <!-- 画像の位置：マーカー基準でposition x(正が右、負が左?)  y(正が右、負が左?) z(正が下、負が上?)  -->
                <a-image
                    src="assets/HCG-kh.png"
                    rotation="-90 0 0" scale="3 3 3" position="0 0 0"
                    gesture-handler class="clickable"
                ></a-image>
            </a-marker>
                
            <!-- ここにAR Marker3の設定を入れる。urlでフォルダ内の.pattファイルを指定している -->
            <a-marker
                type="pattern" preset="custom" url="assets/marker.patt"
                raycaster="objects: .clickable"
                emitevents="true"
                cursor="fuse: false; rayOrigin: mouse;"
            >
                <!-- 複数表示する場合は入れ子にしたほうが楽、奥に表示するものから記述する -->
                <a-image
                    src="assets/HCG-kh.png"
                    rotation="-90 0 0" scale="2 2 2" position="0 0 0">
                    <a-image
                        src="assets/HCG-mm.png"
                        scale="1 1 1" position="0 0 -.1">
                    </a-image>
                </a-image>
            </a-marker>
                
            <a-entity camera></a-entity>
        </a-scene>

        <div class="camera-controls">
            <button class="shutter-button" onclick="takeScreenshot()"></button>
        </div>

        <!-- スクショ機能追加 -->
        <script>
            function takeScreenshot() {
                const scene = document.querySelector('a-scene');
                const screenshot = scene.components.screenshot;
                const canvas = screenshot.getCanvas('perspective');
                const imgData = canvas.toDataURL('image/png');
                const link = document.createElement('a');
                link.href = imgData;
                link.download = 'ar-screenshot.png';
                link.click();
            }
        </script>
        
    </body>
</html>
